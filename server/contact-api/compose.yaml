# Runs the contact-form handler. Start or update it with:
#   docker compose up -d --build
services:
  contact-api:
    build: .
    container_name: bi-contact-api
    restart: unless-stopped
    env_file: .env
    # Bound to 127.0.0.1 only: reachable by Caddy on this server, never from
    # the internet (Docker would otherwise publish around the firewall).
    ports:
      - "127.0.0.1:3001:3001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
